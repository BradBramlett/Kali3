#####################Customizations###################################

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

#Refresh Tmux
bind r source-file "$HOME/.tmux.conf"

#Split Panes
bind -n M-o split-window -h
bind -n M-e split-window -v

#Navigate Panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -n M-z resize-pane -Z
bind -n C-Z resize-pane -Z
#Turn on mouse
set -g mouse on

#Reassign x to kill session
unbind x
bind x kill-session
bind -n M-x kill-session
#Paste Buffers
unbind b
bind b choose-buffer

bind -n C-P paste-buffer
#Reassign q to exit pane
unbind q
# bind q run-shell 'tmux capture-pane -pS - -t #{pane_id} > ~/logs/tmux_#{pane_id}_$(date +%Y%m%d_%H%M).log' \; kill-pane
bind -n M-q kill-pane
set-option -g default-command "$HOME/.tmux/scripts/startup.sh"

#Clipboard functionality
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_selection_mouse 'primary'
set -g @yank_selection 'primary'
set -g @yank_action 'copy-pipe-and-cancel'

#Moves Status Bar
set-option -g status-position top

#Turn on clipboard
set -s copy-command "wl-copy -p"
set -g set-clipboard on

#Detach
bind -n M-d detach

# Cycle Windows:
bind -n M-n new-window
bind -n C-n next-window

#Possible fix for copy and paste
unbind [
bind -n M-v copy-mode
setw -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-selection

# XTERM for reverse shells. 
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

bind-key -n M-b setw synchronize-panes
